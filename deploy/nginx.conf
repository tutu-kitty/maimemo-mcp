# Nginx reverse proxy for maimemo-mcp.
#
# Install on Tencent Cloud (Ubuntu/Debian):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/maimemo-mcp
#   sudo ln -s /etc/nginx/sites-available/maimemo-mcp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# On CentOS/TencentOS place it in /etc/nginx/conf.d/maimemo-mcp.conf instead.
#
# Replace mcp.example.com with your own domain, then run certbot to add TLS.

upstream maimemo_mcp {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.example.com;

    # Certbot will rewrite this block to redirect to HTTPS.
    location / {
        proxy_pass http://maimemo_mcp;
        include /etc/nginx/proxy_params;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.example.com;

    # Populated by: sudo certbot --nginx -d mcp.example.com
    # ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;

    # MCP payloads are small; keep a sane cap.
    client_max_body_size 8m;

    location / {
        proxy_pass http://maimemo_mcp;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- Critical for MCP streaming -------------------------------
        # Streamable HTTP and SSE both push server->client events. Buffering
        # or short read timeouts will silently break long-lived sessions.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;

        # Pass the MCP session header through in both directions.
        proxy_pass_header mcp-session-id;
    }

    location = /healthz {
        proxy_pass http://maimemo_mcp/healthz;
        access_log off;
    }
}
